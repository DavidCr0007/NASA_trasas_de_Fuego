[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmonized-heat-neiva"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "fastapi>=0.162.7",
    "pyarrow",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/harmonize", "src/api", "src/ui"]

# ADR 0016: despliegue en Vercel importando el repositorio (app completa con API).
[tool.vercel]
entrypoint = "vercel_app:app"

[tool.vercel.scripts]
build = "python tools/construir_vercel.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

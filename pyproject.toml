[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmonized-heat-neiva"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/harmonize", "src/api", "src/ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
